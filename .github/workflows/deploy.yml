name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hourly during US market hours (13:30-20:00 UTC), Mon-Fri, so the
    # macro-data.json snapshot baked into the deploy stays fresh.
    - cron: '45 13-20 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fetch Yahoo macro data server-side (no CORS in CI) so the static site
      # can serve it as macro-data.json. Fails the deploy if Yahoo is down,
      # keeping the previously published data live.
      - run: node scripts/fetch-macro-data.mjs

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
